<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy-900:#141238; --navy-800:#1D1B4B; --navy-700:#2B2870;
    --orange:#FF6A2E; --orange-deep:#E5551C;
    --yellow:#FFC93C; --teal:#4FBFB2; --sky:#2FB2E8;
    --paper:#FBF9F4; --white:#FFFFFF;
    --ink:#1B1B33; --muted:#68677E; --muted-light:#B7B4E0; --line:#E7E4DA;
    --radius:18px;
  }
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{max-width:100%;display:block;height:auto}
  h1,h2,h3{font-family:Sora,Inter,sans-serif;color:var(--ink);letter-spacing:-.01em}
  .wrap{width:100%;max-width:720px;margin:0 auto;padding:0 22px}
  .center{text-align:center}
  section{padding:clamp(48px,8vw,84px) 0}

  /* ── HERO ── */
  .hero{background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,106,46,.20), transparent 55%),
      radial-gradient(90% 70% at 90% 110%, rgba(47,178,232,.16), transparent 60%),
      var(--navy-900);
    color:var(--white);padding:clamp(40px,7vw,64px) 0 clamp(48px,8vw,72px)}
  .brandmark{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:clamp(20px,4vw,30px)}
  .brandmark img{width:34px;height:34px}
  .brandmark span{font-family:Sora,sans-serif;font-weight:700;font-size:19px;color:var(--white);letter-spacing:.01em}

  h1.hero-h1{color:var(--white);font-weight:800;font-size:clamp(30px,6.4vw,46px);line-height:1.12;max-width:600px;margin:0 auto}
  .hero-sub{font-size:clamp(15px,2.2vw,17.5px);color:var(--muted-light);max-width:480px;margin:16px auto 0}
  .hero-sub b{color:var(--white);font-weight:600}

  /* ── ROLETA ── */
  .roleta-stage{position:relative;width:min(78vw,360px);height:min(78vw,360px);margin:clamp(34px,6vw,46px) auto 0}
  .pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:5;
    width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:22px solid var(--orange);
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
  .roleta{position:relative;width:100%;height:100%;border-radius:50%;cursor:pointer;
    box-shadow:0 0 0 8px rgba(255,255,255,.06), 0 30px 60px rgba(0,0,0,.45)}
  .wheel{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;
    transition:transform 4.4s cubic-bezier(.14,.82,.24,1)}
  .roleta:active .wheel{filter:brightness(.98)}

  .spin-btn{margin:clamp(30px,5vw,38px) auto 0;display:flex;align-items:center;justify-content:center;
    width:100%;max-width:400px;border:0;cursor:pointer;background:linear-gradient(135deg,var(--orange),var(--orange-deep));
    color:var(--white);font-family:Sora,sans-serif;font-weight:700;font-size:clamp(15px,2.2vw,17px);
    padding:18px 26px;border-radius:14px;box-shadow:0 16px 36px rgba(255,106,46,.35);transition:transform .15s,filter .15s}
  .spin-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .spin-btn:disabled{opacity:.65;cursor:default;transform:none}

  .microcopy{max-width:400px;margin:16px auto 0;font-size:13px;color:var(--muted-light);text-align:center}
  .attempt-msg{display:none;max-width:400px;margin:14px auto 0;font-size:13.5px;color:var(--yellow);text-align:center;font-weight:600}

  /* ── resultado ── */
  #resultado{display:none;max-width:520px;margin:clamp(30px,6vw,40px) auto 0;background:var(--white);color:var(--ink);
    border-radius:20px;padding:clamp(26px,5vw,36px);box-shadow:0 30px 70px rgba(0,0,0,.35)}
  #resultado.show{display:block;animation:pop .5s ease}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
  #resultado .tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--orange-deep);
    background:#FFF1E8;border-radius:100px;padding:7px 14px;margin-bottom:14px}
  #resultado h2{font-weight:800;font-size:clamp(21px,4.4vw,26px);line-height:1.22}
  #resultado .desc{color:var(--muted);margin-top:12px;font-size:15px}
  .prices{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:22px 4px 4px;flex-wrap:wrap}
  .prices .from{font-size:14.5px;color:var(--muted);text-decoration:line-through}
  .prices .to{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(24px,5vw,30px);color:var(--orange-deep)}
  #resultado .fine{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}

  footer{padding:30px 22px 40px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
  footer .brand{font-family:Sora,sans-serif;font-weight:700;color:var(--ink)}
  footer .dis{max-width:560px;margin:10px auto 0}

  @media (prefers-reduced-motion: reduce){
    .wheel{transition-duration:.6s !important}
  }
</style>
</head>
<body>

<!-- ═══════════════ HERO + ROLETA ═══════════════ -->
<section class="hero">

    <button class="spin-btn" id="spin" type="button">Girar a roleta</button>
    <p class="microcopy" id="microcopy">Você tem até 3 tentativas. Boa sorte!</p>
    <p class="attempt-msg" id="attempt-msg" aria-live="polite"></p>

    <!-- ═══ RESULTADO (preenchido via JS, sem link/CTA — ação presencial) ═══ -->
    <div id="resultado" aria-live="polite"></div>
  </div>
</section>

<footer>
  <div class="brand">nowmed Tecnologia</div>
</footer>

<script>
(function(){
  var wheel = document.getElementById('wheel'),
      btn = document.getElementById('spin'),
      resultado = document.getElementById('resultado'),
      microcopy = document.getElementById('microcopy'),
      attemptMsg = document.getElementById('attempt-msg'),
      spinning = false,
      finished = false,
      attemptsUsed = 0,
      currentRotation = 0;

  var MAX_TENTATIVAS = 3;   // total de giros permitidos por visita
  var VOLTAS = 5;           // voltas extras a cada giro, só de efeito visual

  // ── Fatias da roleta, 45° cada, sentido horário a partir do topo (ponteiro) ──
  // As 4 fatias de cor sólida têm prêmio; as 4 fatias azul-marinho "em branco"
  // contam como "não foi dessa vez", igual a fatia "Tente novamente (Azar)".
  var FATIAS = [
    { angulo: 0,   premio: 'fone' },
    { angulo: 45,  premio: null },
    { angulo: 90,  premio: 'garrafinha' },
    { angulo: 135, premio: null },
    { angulo: 180, premio: 'teleconsulta' },
    { angulo: 225, premio: null },
    { angulo: 270, premio: null }, // "Tente novamente (Azar)"
    { angulo: 315, premio: null }
  ];

  // Ação presencial: não há link de checkout nem de contato — o especialista
  // já está ao lado da pessoa, então o resultado só mostra o prêmio ganho.
  var CONTEUDO = {
    fone: {
      titulo: 'Parabéns! Você ganhou 1 fone de ouvido Nowmed.',
      desc: 'Fale com o especialista Nowmed que está com você agora pra retirar seu brinde.',
      extra: ''
    },
    garrafinha: {
      titulo: 'Parabéns! Você ganhou 1 garrafinha Nowmed.',
      desc: 'Fale com o especialista Nowmed que está com você agora pra retirar seu brinde.',
      extra: ''
    },
    teleconsulta: {
      titulo: 'Parabéns! Você ganhou 30 dias grátis de teleconsulta com a Nowmed.',
      desc: 'Fale com o especialista Nowmed que está com você agora pra ativar seus 30 dias grátis.',
      extra: '<div class="prices"><span class="from">Assinatura normal R$39,90/mês</span><span class="to">Grátis nos primeiros 30 dias</span></div>'
    }
  };

  function sortearFatia(garantida){
    if (garantida){
      // última tentativa sem prêmio ainda: sorteia só entre as fatias premiadas
      var premiadas = FATIAS.filter(function(f){ return f.premio; });
      return premiadas[Math.floor(Math.random() * premiadas.length)];
    }
    return FATIAS[Math.floor(Math.random() * FATIAS.length)];
  }

  function girarPara(anguloCentro){
    var desejado = (360 - anguloCentro) % 360;
    var atual = ((currentRotation % 360) + 360) % 360;
    var diferenca = (desejado - atual + 360) % 360;
    var jitter = (Math.random() * 26) - 13; // variação dentro da fatia (±13°)
    currentRotation += (360 * VOLTAS) + diferenca + jitter;
    wheel.style.transform = 'rotate(' + currentRotation + 'deg)';
  }

  function encerrar(){
    finished = true;
    btn.style.display = 'none';
    microcopy.style.display = 'none';
    attemptMsg.style.display = 'none';
    resultado.classList.add('show');
    resultado.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function mostrarGanhou(chave){
    var c = CONTEUDO[chave];
    resultado.innerHTML =
      '<span class="tag">🎉 Prêmio garantido</span>' +
      '<h2>' + c.titulo + '</h2>' +
      '<p class="desc">' + c.desc + '</p>' +
      c.extra;
    encerrar();
  }

  function girar(){
    if (spinning || finished) return;
    spinning = true;
    btn.disabled = true;
    btn.textContent = 'Girando...';
    attemptMsg.style.display = 'none';

    var ultimaTentativa = (attemptsUsed + 1) === MAX_TENTATIVAS;
    var fatia = sortearFatia(ultimaTentativa);
    attemptsUsed++;
    girarPara(fatia.angulo);

    setTimeout(function(){
      spinning = false;
      if (fatia.premio){
        mostrarGanhou(fatia.premio);
      } else {
        var restantes = MAX_TENTATIVAS - attemptsUsed;
        attemptMsg.textContent = 'Não foi dessa vez! Você ainda tem ' + restantes + (restantes === 1 ? ' tentativa.' : ' tentativas.');
        attemptMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Girar novamente (tentativa ' + (attemptsUsed + 1) + ' de ' + MAX_TENTATIVAS + ')';
      }
    }, 4600); // duração da transição (4.4s) + folga
  }

  btn.textContent = 'Girar a roleta (tentativa 1 de ' + MAX_TENTATIVAS + ')';
  btn.addEventListener('click', girar);
  document.getElementById('roleta').addEventListener('click', girar);
})();
</script>
